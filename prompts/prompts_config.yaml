intent_analysis:
  user_prompt_template: '你负责把用户的医学文献检索需求转换为结构化检索条件。


    用户需求：

    {user_input}


    请只输出一个合法 JSON 对象，不要输出解释、Markdown、代码块或其他文字。


    JSON 字段：

    query：PubMed 检索式，使用 MeSH Terms、Title/Abstract 和布尔逻辑。

    year_start：起始年份，未指定时为 null。

    year_end：终止年份，未指定时为 null。

    min_if：最低影响因子，未指定时为 null。

    max_if：最高影响因子，未指定时为 null。

    cas_zones：中科院分区整数列表，例如 [1, 2]；未指定时为 []。

    jcr_quartiles：JCR 分区列表，例如 ["Q1", "Q2"]；未指定时为 []。

    new_rui_2026：新锐 2026 分区整数列表，例如 [1, 2]；未指定时为 []。

    keywords：核心主题英文关键词列表。


    规则：

    1. 保留用户明确提出的主题、年份、影响因子和分区条件。

    2. 不要自行添加用户没有提出的筛选条件。

    3. “近5年”按当前年份向前计算，包含当前年份。

    4. 中科院、新锐分区使用整数列表。

    5. JCR 分区使用 Q1、Q2、Q3、Q4。

    6. 影响因子必须是数字。

    7. query 使用 OR 连接同义词，使用 AND 连接不同概念。

    8. 不确定的字段使用 null 或空数组。

    9. 不得编造不存在的 MeSH 词、影响因子、分区或研究结论。'
outline_generation:
  user_prompt_template: '你负责根据用户研究主题和筛选后的文献，生成中文医学综述大纲。


    研究主题：

    {topic}


    文献摘要：

    {literature_summary}


    请输出 Markdown 格式大纲，包含：


    # 综述标题


    ## 1. 引言

    ## 2. 研究现状

    ## 3. 主要研究证据

    ## 4. 争议与不足

    ## 5. 未来研究方向

    ## 6. 结论


    规则：

    1. 大纲必须围绕研究主题。

    2. 只能使用文献摘要中能够支持的信息。

    3. 不得编造数据、研究结果或文献结论。

    4. 每个章节写出需要讨论的核心问题。

    5. 章节顺序应符合医学综述逻辑。

    6. 不要输出解释性文字。'
review_generation:
  user_prompt_template: '你负责根据大纲和文献摘要撰写中文医学综述。


    研究主题：

    {title}


    综述大纲：

    {outline_content}


    文献摘要：

    {literature_info}


    请只输出完整的 Markdown 综述正文，不要输出说明、代码块或其他文字。


    写作要求：

    1. 使用大纲中的章节顺序。

    2. 标题使用 Markdown。

    3. 正文使用连续完整的段落。

    4. 每个主要论点都必须有文献依据。

    5. 按文献出现顺序使用 [1]、[2]、[3] 等引用标记。

    6. 不要在文章末尾生成参考文献列表。

    7. 不得编造数据、结果、样本量、研究结论或引用。

    8. 不能把相关性写成因果性。

    9. 证据不足时使用“目前证据有限”“尚缺乏一致结论”等谨慎表述。

    10. 仅依据提供的文献摘要写作，不补充未经提供的外部信息。

    '



