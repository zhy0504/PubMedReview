[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

[coverage:run]
source = src
omit =
    src/__init__.py
    tests/*

[coverage:report]
fail_under = 15
show_missing = True
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
