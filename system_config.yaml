# ============================================================================
# 智能文献综述系统 - 系统配置文件
# ============================================================================
# 此文件包含系统运行时的所有配置参数
# 修改此文件后需要重启系统才能生效
# ============================================================================

# ----------------------------------------------------------------------------
# 缓存配置
# ----------------------------------------------------------------------------
cache:
  # 默认缓存大小（条目数）
  size: 500
  # 缓存有效期（秒），默认1小时
  ttl: 3600
  # AI模型配置缓存过期时间（天）
  model_cache_expiry_days: 7
  # 是否启用缓存
  enabled: true

# ----------------------------------------------------------------------------
# 批处理配置
# ----------------------------------------------------------------------------
batch:
  # 默认批处理大小
  size: 50
  # 最大工作线程数
  max_workers: 4
  # 批处理间延迟（秒）
  delay: 5.0
  # 分块处理大小
  chunk_size: 200

# ----------------------------------------------------------------------------
# 重试配置
# ----------------------------------------------------------------------------
retry:
  # 最大重试次数
  max_attempts: 3
  # 重试延迟基数（秒），使用指数退避
  delay_base: 2
  # 最大重试延迟（秒）
  delay_max: 10

# ----------------------------------------------------------------------------
# 超时配置
# ----------------------------------------------------------------------------
timeout:
  # HTTP请求超时（秒）
  request: 30
  # 连接超时（秒）
  connect: 10
  # AI生成超时（秒）
  ai_generation: 300

# ----------------------------------------------------------------------------
# 内存限制
# ----------------------------------------------------------------------------
memory:
  # 内存限制（MB）
  limit_mb: 300
  # 启用内存监控
  monitoring_enabled: true

# ----------------------------------------------------------------------------
# AI模型默认参数
# ----------------------------------------------------------------------------
ai:
  # 默认温度参数（0-1，越低越确定性）
  default_temperature: 0.1
  # 默认启用流式输出
  default_stream: true
  # 默认最大token数（null表示不限制）
  default_max_tokens: null
  # 优先使用的模型ID（用于自动选择）
  preferred_model: "gemini-2.5-pro"

# ----------------------------------------------------------------------------
# PubMed 配置
# ----------------------------------------------------------------------------
pubmed:
  # E-utilities API基础URL
  base_url: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils"
  # 每次请求的最大结果数
  max_results_per_request: 200
  # 请求间隔（秒），遵守NCBI速率限制
  request_interval: 0.34
  # 是否启用搜索结果缓存
  cache_enabled: true
  # 搜索缓存有效期（秒），默认24小时
  cache_ttl: 86400

# ----------------------------------------------------------------------------
# 文献筛选配置
# ----------------------------------------------------------------------------
filter:
  # 有效的中科院分区值
  valid_cas_zones: [1, 2, 3, 4]
  # 有效的JCR分区值
  valid_jcr_quartiles: ["Q1", "Q2", "Q3", "Q4"]
  # 最小影响因子默认值
  default_min_if: 0
  # 最大影响因子默认值（0表示不限制）
  default_max_if: 0
  # 期刊数据缓存有效期（秒），默认7天
  journal_cache_ttl: 604800

# ----------------------------------------------------------------------------
# 大纲生成配置
# ----------------------------------------------------------------------------
outline:
  # 最小有效摘要长度（字符）
  min_abstract_length: 50
  # 最大摘要长度（字符）
  max_abstract_length: 2000
  # 最大标题长度（字符）
  max_title_length: 300
  # 大纲验证最小长度（字符）
  validation_min_length: 50

# ----------------------------------------------------------------------------
# 综述生成配置
# ----------------------------------------------------------------------------
review:
  # 默认输出目录
  output_dir: "output/综述文章"
  # 大纲输出目录
  outline_dir: "output/综述大纲"
  # 原始AI输出目录（用于核对）
  raw_output_dir: "output/综述AI返回原始数据"
  # 检索结果输出目录
  search_results_dir: "output/文献检索结果"
  # 默认文章温度参数（稍高以增加创意性）
  article_temperature: 0.3

# ----------------------------------------------------------------------------
# 日志配置
# ----------------------------------------------------------------------------
logging:
  # 日志级别: DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: "INFO"
  # 是否输出到文件
  file_enabled: false
  # 日志文件路径
  file_path: "logs/system.log"
  # 日志文件最大大小（MB）
  max_file_size: 10
  # 保留的日志文件数量
  backup_count: 5

# ----------------------------------------------------------------------------
# 导出配置
# ----------------------------------------------------------------------------
export:
  # 支持的导出格式
  supported_formats: ["md", "csv", "json", "bibtex", "docx"]
  # 默认导出格式
  default_format: "md"
  # DOCX导出样式: academic, simple
  docx_style: "academic"
