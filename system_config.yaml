# PubMedReview 系统默认配置
# 修改后重启生效。密钥、接口、各模块模型和思考强度在 Web 配置页设置。
# 仅保留当前代码有实际调用、需要在此暴露的默认项。

ai:
  # 模块初始化时使用的后备模型；运行任务时由 Web 模块模型配置覆盖。
  preferred_model: "gpt-5.6-luna"

export:
  # 后备输出格式：md、docx、both；Web 任务指定格式时优先使用任务设置。
  review_format: "docx"
  # 可选 Pandoc 参考模板；路径相对于项目目录，文件缺失时由导出器回退。
  medical_template: "tools/medical_template.docx"
